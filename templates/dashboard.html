<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>이동형 환경 데이터 수집 플랫폼 - 대시보드</title>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f5f5f5; }
        .main-container { display: flex; gap: 20px; }
        .dashboard-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; flex: 3; }
        .card { background: #fff; border: 1px solid #ccc; border-radius: 5px; padding: 15px; cursor: pointer; }
        .card:hover { transform: scale(1.01); box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .card-title { background-color: #ffe699; padding: 5px 10px; display: inline-block; font-weight: bold; margin-bottom: 10px; }
        .status-sidebar { flex: 1; background: #d9d9d9; border: 1px solid #999; padding: 20px; border-radius: 5px; }
        .status-title { background-color: #ffe699; padding: 10px; text-align: center; font-weight: bold; margin-bottom: 20px; }
        .status-item { background: #fff; padding: 15px; border-radius: 5px; margin-bottom: 10px; }
        .chart-container { position: relative; height: 140px; width: 100%; }
    </style>
</head>
<body>

    <h2>이동형 환경 데이터 수집 대시보드</h2>

    <!-- POST 이동을 위한 가상 폼 -->
    <form id="postForm" method="POST" style="display: none;">
        <input type="hidden" name="search_date" id="searchDateInput">
    </form>

    <div class="main-container">
        <!-- 4개 영역 그리드 -->
        <div class="dashboard-grid">
            <div class="card" onclick="sendPost('/temp')">
                <div class="card-title">온도 그래프</div>
                <div class="chart-container">
                    <canvas id="tempChart"></canvas>
                </div>
            </div>
            <div class="card" onclick="sendPost('/hum')">
                <div class="card-title">습도 그래프</div>
                <div class="chart-container">
                    <canvas id="humChart"></canvas>
                </div>
            </div>
            <div class="card" onclick="sendPost('/co2')">
                <div class="card-title">CO2 그래프</div>
                <div class="chart-container">
                    <canvas id="co2Chart"></canvas>
                </div>
            </div>
            <div class="card" onclick="sendPost('/dust')">
                <div class="card-title">미세먼지 그래프</div>
                <div class="chart-container">
                    <canvas id="dustChart"></canvas>
                </div>
            </div>
        </div>

        <!-- 우측 Machine Status 란 -->
        <div class="status-sidebar">
            <div class="status-title">Machine Status</div>
            <div class="status-item"><strong>전원 상태:</strong> <span style="color: green;">{{ status.power }}</span></div>
            <div class="status-item"><strong>배터리 잔량:</strong> {{ status.battery }}%</div>
            <div class="status-item"><strong>현재 위치:</strong> <span style="color: blue; font-weight: bold;">{{ status.current_location }}</span></div>
        </div>
    </div>

    <script>
        // 차트 객체들을 저장할 변수
        const chartInstances = {};

        // 클릭 시 POST 방식으로 페이지를 이동시키는 함수
        function sendPost(url) {
            const form = document.getElementById('postForm');
            form.action = url;
            
            // 로컬 시간 기준 '어제' 날짜 계산 ( YYYY-MM-DD )
            const yesterday = new Date();
            yesterday.setDate(yesterday.getDate() - 1);
            
            const year = yesterday.getFullYear();
            const month = String(yesterday.getMonth() + 1).padStart(2, '0');
            const day = String(yesterday.getDate()).padStart(2, '0');
            
            document.getElementById('searchDateInput').value = `${year}-${month}-${day}`;
            form.submit();
        }

        // 실시간 연동 미니 차트 로드 함수
        function loadMiniChart(canvasId, label, color, code) {
            const ctx = document.getElementById(canvasId).getContext('2d');
            
            chartInstances[code] = new Chart(ctx, {
                type: 'line',
                data: { labels: [], datasets: [{ label: label, borderColor: color, data: [], fill: false }] },
                options: { 
                    responsive: true,
                    maintainAspectRatio: false
                }
            });

            function fetchLatestData() {
                fetch(`/api/chart-data?value_code=${code}`)
                    .then(res => res.json())
                    .then(data => {
                        const chart = chartInstances[code];
                        chart.data.labels = data.labels;
                        chart.data.datasets[0].data = data.values;
                        chart.update('none'); // 애니메이션 없이 빠르게 갱신
                    })
                    .catch(err => console.error(`Error loading ${code} chart:`, err));
            }

            // 최초 1회 실행 후 10초마다 자동 갱신
            fetchLatestData();
            setInterval(fetchLatestData, 10000);
        }

        window.onload = function() {
            loadMiniChart('tempChart', '온도', '#ff4d4d', 'TEMP');
            loadMiniChart('humChart', '습도', '#4da6ff', 'HUMI');
            loadMiniChart('co2Chart', 'CO2', '#cca300', 'CO2_');
            loadMiniChart('dustChart', '미세먼지', '#8c8c8c', 'DUST');
        };
    </script>
</body>
</html>
