{% extends "base.html" %}
{% block title %}Humidity{% endblock %}
{% block header %}
{% include "header.html" %}
{% endblock %}
{% block content %}
<div class="date-picker-container">
    <label for="chartDate">날짜 선택: </label>
    <input type="date" id="chartDate" name="chartDate">
</div>
<div class="chart-hum">
    <div class="chart-box"><canvas id="today"></canvas></div>
    <div class="chart-box"><canvas id="compare"></canvas></div>
</div>
{% endblock %}

{% block script %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4/build/global/luxon.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon"></script>

<script>
    function formatToSingleTimeSeries(chartItem) {
        if (!chartItem || !chartItem.labels || !chartItem.values) return [];
        
        return chartItem.labels.map((label, idx) => ({
            x: label,
            y: chartItem.values[idx],
            point: chartItem.points ? chartItem.points[idx] : 'N/A'
        }));
    }

    const chartsData = {{ chart | tojson | safe }};
    const rawData = formatToSingleTimeSeries(chartsData);

    function createChartConfig(datas) {
        return {
            type: 'line',
            data: {
                datasets: [{
                    data: datas,
                }]
            },
            options: {
                plugins: {
                    legend: {
                        display: false
                    },
                    title: {
                        display: true,
                        text: '습도 (%)',
                        align: 'start',
                        padding: {
                            bottom: 10
                        },
                        font: {
                            weight: 'bold'
                        }
                    },
                    tooltip: {
                        callbacks: {
                            title: function(context) {
                                return `${context[0].label}`;
                            },
                            label: function(context) {
                                const raw = context.raw;
                                return ` [구역 ${raw.point}] 습도: ${raw.y}%`;
                            }
                        }
                    }
                },
                scales: {
                    x: {
                        type: 'time',
                        time: {
                            parser: 'HH:mm',
                            unit: 'hour',
                            displayFormats: { hour: 'HH:mm' }
                        },
                        min: '00:00',
                        max: '23:59',
                    },
                    y: {
                        beginAtZero: false,
                        min: 0,
                        max: 100
                    }
                }
            }
        };
    }

    const ctx1 = document.getElementById('today');
    const todayChart = new Chart(ctx1, createChartConfig(rawData));

    const ctx2 = document.getElementById('compare');
    const compareChart = new Chart(ctx2, createChartConfig(rawData));

    const dateInput = document.getElementById('chartDate');

    dateInput.addEventListener('change', function(event) {
        const selectedDate = event.target.value;
        if (!selectedDate) return;

        fetch("/api/hum", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ date: selectedDate })
        })
        .then(response => response.json())
        .then(data => {
            const responseChartData = data.chart ? data.chart : data;
            compareChart.data.datasets[0].data = formatToSingleTimeSeries(responseChartData);

            compareChart.update();
        })
        .catch(error => { console.error(error); });
    });
</script>
{% endblock %}
